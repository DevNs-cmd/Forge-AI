global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "forge-ai"
    env: "local"

# ── Alerting (optional — extend later) ────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# ── Scrape Configs ─────────────────────────────────────────────────────────────
scrape_configs:

  # 1. Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. FastAPI AI Service — /metrics endpoint
  #    When running locally (not in Docker): host.docker.internal:8000
  #    When running in Docker Compose:       ai-service:8000
  - job_name: "forge-ai-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # Fallback for Linux (host network):
    # - targets: ["172.17.0.1:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "forge-ai-service"

  # 3. Host system metrics via Node Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 4. Docker container metrics via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # 5. Next.js web app (if you add a /metrics endpoint later)
  # - job_name: "forge-web"
  #   static_configs:
  #     - targets: ["host.docker.internal:3000"]
